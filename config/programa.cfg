# ============================================================================
# programa.cfg - Configuracion del linker para el monitor 6502 (tang nano 9k)
# ============================================================================
# Programa standalone cargado por el monitor en $0800. Se enlaza contra
# none.lib de cc65 (solo rutinas internas del compilador); toda la
# entrada/salida vive en la ROM del monitor (romapi.h, jump table en $BF00).
#
# Mapa de memoria del monitor (igual que el resto de juegos del sistema):
#
#   $0002-$001F  variables del monitor         -> NO usar
#   $0020-$007F  zero page del programa
#   $0100-$01FF  stack hardware del 6502
#   $0800-$3F9F  codigo + rodata + data + bss del programa
#   $3FA0-$3FFD  software stack de cc65 (c_sp crece hacia abajo desde $3FFD)
#   $3FFE-$3FFF  flag de AUTOBOOT del monitor  -> NO usar
#   $BF00        jump table de la ROM
#   $C000+       ROM del monitor
# ============================================================================

SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100;
    __STACKSTART__: type = weak, value = $3FFD;

    # Simbolos requeridos por el runtime C
    __CONSTRUCTOR_COUNT__: type = weak, value = 0;
    __DESTRUCTOR_COUNT__: type = weak, value = 0;
    __CONSTRUCTOR_TABLE__: type = weak, value = $0800;
    __DESTRUCTOR_TABLE__: type = weak, value = $0800;
}

MEMORY {
    # Zero page: $20-$7F para no conflictuar con el monitor ($02-$1F)
    ZP:   start = $0020, size = $0060, type = rw, define = yes;

    # RAM del programa: $0800-$3F9F (~14 KB)
    # (el monitor reserva $3FFE-$3FFF para el flag de AUTOBOOT)
    RAM:  start = $0800, size = $379F, type = rw, file = %O, define = yes;

    # Area del software stack de cc65: $3FA0-$3FFD
    STACK: start = $3FA0, size = $005E, type = rw, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP, type = zp, define = yes;

    STARTUP:  load = RAM, type = ro;
    CODE:     load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    RODATA:   load = RAM, type = ro, optional = yes;
    DATA:     load = RAM, type = rw, define = yes, optional = yes;
    BSS:      load = RAM, type = bss, define = yes, optional = yes;
}
